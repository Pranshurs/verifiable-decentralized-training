name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Solidity tests
        working-directory: contracts
        run: forge test -vv

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check --select E,F,W,B,I --ignore E501 src tests
      - name: Build the contract and the workload image
        run: |
          (cd contracts && forge build)
          docker build -f workloads/logreg-sgd/Dockerfile -t stesh-mvp/logreg-sgd:1 .
      - name: "Tests: unit + end to end (Anvil, escrow contract, Docker containers)"
        run: pytest -q -rs
      - name: Adversarial demo
        run: stesh-mvp-demo
